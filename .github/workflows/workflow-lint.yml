# Lints workflows and enforces ADR-006 supply-chain rules:
# every `uses:` pinned to a full commit SHA, no `pull_request_target`.
name: Workflow lint

on:
  pull_request:
    paths:
      - ".github/**"
      - "**/action.yml"
      - "**/action.yaml"
      - "scripts/check-workflow-pins.mjs"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint (checksum-verified release binary)
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint

      - name: actionlint
        run: '"$RUNNER_TEMP/actionlint" -color'

      - name: Full-SHA pins, no PR-target trigger
        run: node scripts/check-workflow-pins.mjs
