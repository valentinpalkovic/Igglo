# CI for the monorepo (ADR-006). Permissions and runner rules as ADR-006 proposes.
# Each review gate is its own job so branch protection can require it by name
# (handbook, Code review, "Review gates"). Renaming a job renames its required
# check: update the branch protection on main in the same PR.
# The fram-selftest job (actions: read) is added with the first Fram Action code.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Build first (this also makes `lint` the gate for a broken build):
      # type-aware lint resolves workspace imports such as
      # @iglo/webmcp-adapter/driver through "exports", which point to dist/.
      - run: pnpm build
      - name: Lint (includes the ADR-004 modelContext rule)
        run: pnpm lint
      - name: Format
        run: pnpm format:check

  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Unit tests
        run: pnpm test
      - name: Repo script tests
        run: pnpm test:scripts

  architecture:
    name: architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Package boundaries and cycles (ADR-001)
        run: pnpm depcruise

  chromatic:
    name: chromatic
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # There is no Storybook in the repo yet, so there is nothing to snapshot.
      # This job passes while that is true and fails as soon as a .storybook/
      # directory appears, until this step is replaced by the Chromatic run.
      # Wiring Chromatic needs a Chromatic project and token (CEO approval:
      # external service). Tracked in IGL-82.
      - name: Visual tests (Chromatic)
        run: |
          storybooks="$(git ls-files | grep -E '(^|/)\.storybook/' | cut -d/ -f1-3 | sort -u || true)"
          if [ -z "$storybooks" ]; then
            echo "::notice title=Chromatic::No Storybook in the repo yet; nothing to snapshot."
            exit 0
          fi
          echo "::error title=Chromatic::Storybook found but Chromatic is not wired yet:"
          echo "$storybooks"
          exit 1

  forbidden-paths:
    name: forbidden-paths
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No node_modules, build output or tool caches in git
        run: node scripts/check-forbidden-paths.mjs
